name: test

# The action against itself, on every change: once where the gate must fail (the
# fixture pins PyYAML 5.1, which has critical advisories) and once where it must
# not (gate off, outputs read). Both install the default `version` from PyPI — the
# path the README example takes, so a tag is only cut on a commit where that path
# was just proven. Code scanning upload is exercised by valvur's own repository,
# which uses this action on every commit with `version: ""` (the shim from the
# tree under test), so a valvur change that breaks the action is found there first.
#
# On both Ubuntu images GitHub offers, named rather than `ubuntu-latest`: a
# composite action has no runner of its own — it runs on the caller's — and
# `ubuntu-latest` moves from 24.04 to 26.04 over a month from 2026-10-19
# (actions/runner-images#14748). The shim goes into the runner's own Python
# through pipx (3.12 on 24.04, 3.14 on 26.04), so the README example is proven on
# what users will have before they have it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate-fails-on-the-fixture:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        continue-on-error: true
        with:
          path: fixture
          fail-on: critical
          sarif: "false"
      - name: The gate failed, and the outputs say why
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          STATUS: ${{ steps.scan.outputs.status }}
          COMPLETE: ${{ steps.scan.outputs.complete }}
          ACTIVE: ${{ steps.scan.outputs.active }}
        run: |
          echo "outcome=$OUTCOME status=$STATUS complete=$COMPLETE active=$ACTIVE"
          test "$OUTCOME" = "failure"
          test "$STATUS" = "findings"
          test "$COMPLETE" = "true"
          test "$ACTIVE" -ge 5

  outputs-without-the-gate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        with:
          path: fixture
          gate: "false"
          sarif: "false"
          budget: "240"
          jobs: "4"
      - name: The scan ran, the result is complete, nothing left the runner
        env:
          RESULTS: ${{ steps.scan.outputs.results }}
          COMPLETE: ${{ steps.scan.outputs.complete }}
        run: |
          test "$COMPLETE" = "true"
          test -f "$RESULTS/SUMMARY.md"
          test -f "$RESULTS/results.sarif"
          python3 -c "import json,sys; n=json.load(open('$RESULTS/run.json'))['network']; print(n); sys.exit(0 if n['what_left_the_machine']=='nothing' else 1)"
